[package]
name = "canewatch"
version = "0.1.0"
edition = "2021"   # safer until 2024 edition stabilizes

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio-rustls", "uuid", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
jsonwebtoken = "9"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
rand_core = "0.10.0-rc-6"
